name: cicd

on:
  push:
    branches:
        - main

permissions:
  id-token: write  # lets the job request a GitHub OIDC token for AWS
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history
       
      #Configure docker build
      - name: Set up docker
        uses: docker/setup-buildx-action@v3
        
        #Authenticate with docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      #   # Generate Docker image tags
      # - name: Docker metadata
      #   id: meta
      #   uses: docker/metadata-action@v5
      #   with:
      #     images: ${{ vars.DOCKERHUB_IMAGE }}
      #     tags: |
      #       type=sha,format=long
      #       type=raw,value=latest,enable={{is_default_branch}}

      #   # Build and push image to Docker Hub
      # - name: Build and push Docker image
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: .
      #     push: true
      #     tags: ${{ steps.meta.outputs.tags }}
      #     labels: ${{ steps.meta.outputs.labels }}

        #  Authenticate to AWS using GitHub OIDC
      - name: Log in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

       # Install kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest
      
      # verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

       # connect to Amzon EKS
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      

      # # 11. Update the Deployment with the new image
      # - name: Deploy new Docker image
      #   run: |
      #     kubectl set image \
      #       deployment/"$K8S_DEPLOYMENT" \
      #       "$K8S_CONTAINER"="$IMAGE_NAME:${GITHUB_SHA}" \
      #       -n "$K8S_NAMESPACE"
    
       # Apply Kubernetes Manifests
      - name: Apply Kubernetes Manifests
        run: kubectl apply -f Deploy_service_Manifest/

      # # 12. Verify deployment rollout
      # - name: Verify rollout
      #   run: |
      #     kubectl rollout status \
      #       deployment/"$K8S_DEPLOYMENT" \
      #       -n "$K8S_NAMESPACE" \
      #       --timeout=300s
      - name: Verify EKS connection
        run:
          echo "===== Cluster Info ====="
          kubectl cluster-info

          echo "===== Deployments ====="
          kubectl get deployments -n "$K8S_NAMESPACE"

          echo "===== Services ====="
          kubectl get services -n "$K8S_NAMESPACE"

          echo "===== Pods ====="
          kubectl get pods -n "$K8S_NAMESPACE"

          echo "===== Ingresses ====="
          kubectl get ingress -n "$K8S_NAMESPACE"
